name: flutbeat_frontend
description: "FlutBeat — Experimental AD8232 ECG signal explorer and recorder"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # State management & reactive streams
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Direct USB Serial OTG communication with ESP (No backend!)
  usb_serial:
    git:
      url: https://github.com/altera2015/usbserial.git
      ref: master

  # Local persistence for config settings
  shared_preferences: ^2.3.5

  # Formatting timestamps
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.14
  riverpod_generator: ^4.0.8

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/branding/
