syntax = "proto3";

package telemetry.v1;

// Service exposed by the FlutBeat ECG hardware / DSP node
service TelemetryService {
  // High-frequency server-streaming RPC: emits batched ECG samples (e.g. 10 samples @ 250 Hz = every 40ms)
  // along with instantaneous vitals and lead-off status.
  rpc StreamEcg (StreamEcgRequest) returns (stream EcgWaveformChunk);

  // Server-streaming RPC: emits discrete cardiac events (R-peak detected, Lead-Off alarm, rhythm change)
  rpc StreamCardiacEvents (StreamEventsRequest) returns (stream CardiacEvent);

  // Server-streaming RPC: emits operational and DSP diagnostic logs
  rpc StreamLogs (StreamLogsRequest) returns (stream LogEntry);

  // Unary RPC: query current system & cardiac status snapshot
  rpc GetStatus (GetStatusRequest) returns (StatusResponse);

  // Unary RPC: switch between Hardware (UDP/Serial) and Synthetic ECG Simulator or adjust target BPM/filter
  rpc ConfigureSource (ConfigureSourceRequest) returns (StatusResponse);
}

// Request to stream ECG waveform chunks
message StreamEcgRequest {
  string client_id = 1;
}

// Request to stream cardiac events
message StreamEventsRequest {
  string client_id = 1;
}

// Request to stream logs
message StreamLogsRequest {
  string client_id = 1;
  LogLevel min_level = 2;
}

// Log level
enum LogLevel {
  DEBUG = 0;
  INFO = 1;
  WARN = 2;
  ERROR = 3;
}

// Data ingestion source mode
enum SourceMode {
  SOURCE_MODE_UNSPECIFIED = 0;
  SIMULATOR = 1;
  UDP_WIFI = 2;
  USB_SERIAL = 3;
}

// Lead attachment status from AD8232 LO+ / LO- pins
enum LeadStatus {
  LEAD_STATUS_UNSPECIFIED = 0;
  LEADS_CONNECTED = 1;       // LO+ = 0, LO- = 0
  LEAD_OFF_POSITIVE = 2;     // LO+ = 1
  LEAD_OFF_NEGATIVE = 3;     // LO- = 1
  LEAD_OFF_BOTH = 4;         // LO+ = 1, LO- = 1
}

// Clinical rhythm classification
enum RhythmClassification {
  RHYTHM_UNSPECIFIED = 0;
  NORMAL_SINUS = 1;          // 60 - 100 BPM
  BRADYCARDIA = 2;           // < 60 BPM
  TACHYCARDIA = 3;           // > 100 BPM
  IRREGULAR_ARRHYTHMIA = 4;  // High R-R interval variance
  NO_SIGNAL = 5;             // Leads off or flatline
}

// Single sampled point in time
message EcgSample {
  int64 timestamp_unix_millis = 1;
  uint32 raw_adc = 2;              // 10-bit raw ADC reading (0 - 1023)
  float voltage_mv = 3;            // Converted physical voltage in mV
  float filtered_mv = 4;           // Bandpass + notch filtered voltage in mV
  bool is_r_peak = 5;              // True if this sample is a detected QRS R-peak
  bool lead_off = 6;               // True if either LO+ or LO- is active
}

// Comprehensive real-time cardiac metrics computed by the Rust DSP engine
message CardiacMetrics {
  uint32 heart_rate_bpm = 1;
  uint32 rr_interval_ms = 2;
  float hrv_sdnn_ms = 3;           // Standard deviation of NN/RR intervals
  float hrv_rmssd_ms = 4;          // Root mean square of successive RR differences
  LeadStatus lead_status = 5;
  RhythmClassification rhythm = 6;
  uint32 signal_quality_percent = 7; // 0 - 100%
  uint64 total_beats = 8;
  int64 last_beat_timestamp_ms = 9;
}

// Batched chunk of ECG waveform samples
message EcgWaveformChunk {
  int64 sequence_number = 1;
  uint32 sample_rate_hz = 2;       // 250 Hz default
  repeated EcgSample samples = 3;
  CardiacMetrics metrics = 4;
  SourceMode source_mode = 5;
}

// Discrete cardiac events (alarms, QRS beats, state changes)
enum CardiacEventType {
  CARDIAC_EVENT_UNSPECIFIED = 0;
  R_PEAK_DETECTED = 1;
  LEAD_OFF_TRIGGERED = 2;
  LEAD_RECONNECTED = 3;
  BRADYCARDIA_TRIGGERED = 4;
  TACHYCARDIA_TRIGGERED = 5;
  SOURCE_MODE_SWITCHED = 6;
}

message CardiacEvent {
  int64 sequence_number = 1;
  int64 timestamp_unix_millis = 2;
  CardiacEventType event_type = 3;
  uint32 bpm = 4;
  uint32 rr_interval_ms = 5;
  string description = 6;
}

// Diagnostic and operational log entry
message LogEntry {
  int64 timestamp_unix_millis = 1;
  LogLevel level = 2;
  string component = 3;
  string message = 4;
}

message GetStatusRequest {}

message StatusResponse {
  int64 timestamp_unix_millis = 1;
  uint64 uptime_seconds = 2;
  SourceMode source_mode = 3;
  CardiacMetrics metrics = 4;
  uint64 total_samples_processed = 5;
  uint32 target_sim_bpm = 6;
}

message ConfigureSourceRequest {
  SourceMode source_mode = 1;
  uint32 target_sim_bpm = 2;       // e.g. 60 - 160 BPM for simulation
  bool reset_dsp = 3;
}
